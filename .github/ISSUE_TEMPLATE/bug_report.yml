name: Bug report
description: Report a reproducible problem in code, data validation, or replay.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private paths, or restricted source media in a public issue.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed behavior and why it is unexpected.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the exact command and the smallest relevant input.
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: Include the complete error or mismatched result.
      render: text
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or release version.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, PyTorch, operating system, and CPU or GPU details.
    validations:
      required: true
